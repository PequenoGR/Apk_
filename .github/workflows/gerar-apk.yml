      - name: Instalar e preparar o Android
        run: |
          npm install
          npx cap add android
          cp android-plugin/*.java android/app/src/main/java/com/malhaexpress/app/
          npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK para baixar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MalhaExpress.apk
          gh release delete apk-atual --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create apk-atual MalhaExpress.apk --repo "${{ github.repository }}" --title "Malha Express (APK)" --notes "Baixe o MalhaExpress.apk e instale no celular."
